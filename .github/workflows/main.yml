name: Build Mustawda APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # تنزيل ملفات التطبيق
      - name: Checkout repository
        uses: actions/checkout@v4

      # تثبيت Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # تثبيت Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # الموافقة على تراخيص Android
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      # إنشاء مشروع Android
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/mustawda/app

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root"
            exit 1
          fi

          cp index.html app/src/main/assets/index.html

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "Mustawda"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mustawda.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mustawda.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="مستودع البضاعة"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="com.mustawda.app.MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/mustawda/app/MainActivity.java <<'EOF'
          package com.mustawda.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebResourceRequest;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView webView = new WebView(this);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(
                              WebView view,
                              WebResourceRequest request) {

                          Uri uri = request.getUrl();
                          String scheme = uri.getScheme();

                          if (scheme != null &&
                              !scheme.equals("file") &&
                              !scheme.equals("https") &&
                              !scheme.equals("http") &&
                              !scheme.equals("about")) {
                              try {
                                  startActivity(new Intent(
                                      Intent.ACTION_VIEW, uri));
                              } catch (Exception ignored) {
                              }
                              return true;
                          }

                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient());

                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  WebView webView = (WebView)
                      findViewById(android.R.id.content).getRootView();

                  super.onBackPressed();
              }
          }
          EOF

      # إنشاء Gradle Wrapper
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # بناء APK
      - name: Build APK
        run: gradle assembleDebug

      # حفظ APK حتى تتمكن من تنزيله
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mustawda-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
